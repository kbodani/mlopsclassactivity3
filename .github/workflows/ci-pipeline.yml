name: ML CI Workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main   # Workflow now triggers for PRs to main

jobs:
  train_evaluate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Preprocess data
        run: python preprocess.py

      - name: Train model
        run: python train.py --version ${{ github.run_number }}

      - name: Evaluate model
        id: evaluate
        run: python evaluate.py --model model_v${{ github.run_number }}.pkl

      - name: Quality Gate
        if: always()
        run: |
          SCORE=$(python get_score.py --model model_v${{ github.run_number }}.pkl)
          echo "Evaluation score: $SCORE"
          if (( $(echo "$SCORE < 0.5" | bc -l) )); then
            echo "Model did not pass quality gate"
            exit 1
          fi

      - name: Upload model artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-v${{ github.run_number }}
          path: model_v${{ github.run_number }}.pkl
          retention-days: 30

      - name: Upload preprocessed data
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: preprocessed-data-v${{ github.run_number }}
          path: data/preprocessed.csv
          retention-days: 7

      - name: Model training summary
        if: always()
        run: |
          echo "### Model Training Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Number:** ${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Model Version:** v${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
